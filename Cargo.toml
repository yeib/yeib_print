[package]
name = "yeib_print"
version = "0.1.0"
edition = "2021"
authors = ["Yeib <contact@yeib.org>"]
description = "Fast, clean Win32 GDI silent & direct document printing engine for Rust and Tauri on Windows"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yeib/yeib_print"
homepage = "https://github.com/yeib/yeib_print"
documentation = "https://docs.rs/yeib_print"
readme = "README.md"
keywords = ["print", "windows", "gdi", "tauri", "spooler"]
categories = ["os::windows-apis", "multimedia"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security",
    "Win32_Storage_Xps",
] }

[dev-dependencies]
serde_json = "1"
