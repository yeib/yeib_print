[package]
name = "yeib_print"
version = "0.1.0"
edition = "2021"
authors = ["Yeib"]
description = "Motor nativo de enumeración de impresoras e impresión silenciosa Win32 GDI/Spooler para el Ecosistema Yeib"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security",
    "Win32_Storage_Xps",
] }

[dev-dependencies]
serde_json = "1"
